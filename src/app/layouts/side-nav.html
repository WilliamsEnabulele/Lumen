<div class="brand">
  <span class="glyph" aria-hidden="true"></span>
  <span class="name">Lumen</span>
</div>

<nav aria-label="Main">
  <a routerLink="/library" routerLinkActive="here">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5h5v14H4zM10.5 5h4v14h-4zM16.6 5.4l3.4.9-3.2 13.5-3.4-.9z" />
    </svg>
    Library
  </a>

  <a routerLink="/new" routerLinkActive="here">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5v14M5 12h14" />
    </svg>
    New lesson
  </a>

  <a routerLink="/settings" routerLinkActive="here">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" />
      <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6" />
    </svg>
    Settings
  </a>
</nav>

<div class="account">
  <span class="avatar" aria-hidden="true">{{ initial }}</span>
  <span class="who">{{ session.student()?.name || session.student()?.email }}</span>
  <button type="button" class="ghost" (click)="signOut()">Sign out</button>
</div>
